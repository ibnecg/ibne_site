---
layout: default
---

<article class="post">
  <header class="page-hero">
    <div class="container container-narrow">
      <div class="page-hero-tag">Notícias & Mensagens</div>
      <h1 class="page-hero-title">{{ page.title }}</h1>
      <p class="page-hero-lead">
        Publicado em {{ page.date | date: "%d/%m/%Y" }} por {{ page.author | default: site.title }}
      </p>
    </div>
  </header>

  <div class="section">
    <div class="container container-narrow post-card">
      <div class="post-content">
        {{ content }}
      </div>

      <div class="post-footer">
        <a href="{{ '/' | relative_url }}" class="btn btn-outline-primary btn-sm">
          ← Voltar para o Início
        </a>
        <a href="{{ '/programacao' | relative_url }}" class="btn btn-primary btn-sm">
          Conheça Nossos Cultos
        </a>
      </div>
    </div>
  </div>
</article>
