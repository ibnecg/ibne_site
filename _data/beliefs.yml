- title: "A Bíblia Sagrada"
  verse: "2 Timóteo 3:16-17"
  summary: "Cremos na Bíblia como a Palavra inspirada, inerrante e autoritativa de Deus, nossa única e suficiente regra de fé e prática."

- title: "A Trindade"
  verse: "Mateus 28:19"
  summary: "Cremos em um só Deus vivo e verdadeiro, eternamente subsistente em três pessoas: o Pai, o Filho e o Espírito Santo."

- title: "Salvação pela Graça"
  verse: "Efésios 2:8-9"
  summary: "A salvação é dom gratuito de Deus, concedida pela Sua soberana graça e recebida exclusivamente mediante a fé em Jesus Cristo."

- title: "Batismo por Imersão"
  verse: "Romanos 6:4"
  summary: "Praticamos o batismo bíblico de crentes por imersão nas águas, como testemunho público de sepultamento do velho homem e ressurreição para uma nova vida."

- title: "A Ceia do Senhor"
  verse: "1 Coríntios 11:23-26"
  summary: "Celebramos a Ceia memorial instituída por Cristo com pão e cálice, proclamando Sua morte vicária até que Ele venha."

- title: "A Grande Comissão"
  verse: "Marcos 16:15"
  summary: "Temos o compromisso inegociável de proclamar as Boas Novas da salvação a toda criatura, começando em nossa cidade até os confins da terra."
