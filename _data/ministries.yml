  subtitle: "O Evangelho em Ação em Campo Grande"
  icon: "globe"
  image: "/assets/images/community.jpg"
  description: "Expressamos o amor de Cristo de forma tangível através do cuidado com famílias em vulnerabilidade, visitas e apoio missionário."
  verse: "Porque tive fome, e destes-me de comer; tive sede, e destes-me de beber... — Mateus 25:35"
  leader: "Conselho de Missões e Diaconia"
  activities:
    - "Distribuição de cestas de alimentos e roupas"
