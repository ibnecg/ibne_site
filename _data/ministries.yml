- id: "pertenser"
  name: "PertenSer"
  subtitle: "Integração & Comunhão"
  icon: "users"
  image: "/assets/images/community.jpg"
  description: "Ações de integração e acolhimento entre os membros da igreja, promovendo a comunhão cristã e fortalecendo laços comunitários através de encontros especiais."
