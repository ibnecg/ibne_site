- id: "mine-infantil"
  name: "MINE - Ministério Infantil Nova Esperança"
  subtitle: "Crianças de 0 a 11 anos"
  icon: "sparkles"
  image: "/assets/images/logo-mine.png"
  image_contain: true
  description: "Ambiente seguro, alegre e estruturado onde as crianças aprendem os princípios bíblicos através de histórias, dinâmicas e amor pastoral."
  verse: "Ensina a criança no caminho em que deve andar, e até quando envelhecer não se desviará dele. — Provérbios 22:6"
  leader: "Coordenação Pedagógica e Voluntários"
  activities:
    - "Culto infantil durante as reuniões de celebração"
    - "Salas temáticas climatizadas por faixa etária"
    - "Equipe de educadores capacitados"
    - "Atividades lúdicas e bíblicas"

- id: "juventude"
  name: "Juventude Nova Esperança"
  subtitle: "Adolescentes e Jovens"
  icon: "flame"
  image: "/assets/images/hero-worship.jpg"
  description: "Uma geração apaixonada por Jesus, engajada em servir a sociedade com fé bíblica, relevância cultural e amizades sólidas."
  verse: "Ninguém despreze a tua mocidade; pelo contrário, torna-te padrão dos fiéis. — 1 Timóteo 4:12"
  leader: "Liderança de Jovens"
  activities:
    - "Culto jovem aos sábados à noite"
    - "Retiros espirituais, acampamentos e conferências"
    - "Grupos de conexão universitários e profissionais"
    - "Ações missionárias e evangelismo criativo"

- id: "louvor-adoracao"
  name: "Louvor & Adoração"
  subtitle: "Música, Canto e Expressão da Graça"
  icon: "music"
  image: "/assets/images/hero-worship.jpg"
  description: "Músicos e cantores dedicados a conduzir a congregação à presença de Deus com excelência musical, reverência e alegria no Espírito."
  verse: "Cantai-lhe um cântico novo; tocai bem e com júbilo. — Salmos 33:3"
  leader: "Ministério de Música"
  activities:
    - "Banda de adoração nos cultos semanais"
    - "Ensaio e discipulado técnico e espiritual"
    - "Equipe de áudio, iluminação e mídia visual"

- id: "mulheres"
  name: "Mulheres de Esperança"
  subtitle: "Ministério Feminino"
  icon: "heart"
  image: "/assets/images/community.jpg"
  description: "Apoio mútuo, oração fervorosa, fortalecimento das mulheres cristãs em seus lares, carreiras e caminhada com Cristo."
  verse: "Mulher virtuosa, quem a achará? O seu valor muito excede o de rubis. — Provérbios 31:10"
  leader: "Liderança Feminina"
  activities:
    - "Chás de comunhão e congressos femininos"
    - "Círculo semanal de oração"
    - "Mentoria entre gerações"

- id: "homens"
  name: "Homens de Honra"
  subtitle: "Ministério Masculino"
  icon: "shield"
  image: "/assets/images/community.jpg"
  description: "Homens comprometidos com a liderança servidora em suas famílias, integridade no trabalho e fidelidade a Deus."
  verse: "Sede vigilantes, permanecei firmes na fé, portai-vos varonilmente, fortalecei-vos. — 1 Coríntios 16:13"
  leader: "Liderança Masculina"
  activities:
    - "Café dos homens e encontros mensais"
    - "Discipulado prático e prestação de contas"
    - "Projetos práticos de apoio à comunidade"

- id: "missoes-acao-social"
  name: "Missões & Ação Social"
  subtitle: "O Evangelho em Ação em Campo Grande"
  icon: "globe"
  image: "/assets/images/community.jpg"
  description: "Expressamos o amor de Cristo de forma tangível através do cuidado com famílias em vulnerabilidade, visitas e apoio missionário."
  verse: "Porque tive fome, e destes-me de comer; tive sede, e destes-me de beber... — Mateus 25:35"
  leader: "Conselho de Missões e Diaconia"
  activities:
    - "Distribuição de cestas de alimentos e roupas"
    - "Apoio a missionários no Brasil e no mundo"
    - "Visitas a asilos, hospitais e orfanatos em MS"
