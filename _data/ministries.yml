- id: "mine-infantil"
  name: "MINE - Ministério Infantil Nova Esperança"
  subtitle: "Crianças de 0 a 11 anos"
  icon: "sparkles"
  image: "/assets/images/logo-mine.png"
  image_contain: true
  description: "Ambiente seguro, alegre e estruturado onde as crianças aprendem os princípios bíblicos através de histórias, dinâmicas e amor pastoral."
  verse: "Ensina a criança no caminho em que deve andar, e até quando envelhecer não se desviará dele. — Provérbios 22:6"
  leader: "Coordenação Pedagógica e Voluntários"
  activities:
    - "Culto infantil durante as reuniões de celebração"
    - "Salas temáticas climatizadas por faixa etária"
    - "Equipe de educadores capacitados"
    - "Atividades lúdicas e bíblicas"

- id: "juventude"
  name: "Juventude Nova Esperança"
  subtitle: "Adolescentes e Jovens"
  icon: "flame"
  image: "/assets/images/hero-worship.jpg"
  description: "Uma geração apaixonada por Jesus, engajada em servir a sociedade com fé bíblica, relevância cultural e amizades sólidas."
  verse: "Ninguém despreze a tua mocidade; pelo contrário, torna-te padrão dos fiéis. — 1 Timóteo 4:12"
  leader: "Liderança de Jovens"
  activities:
    - "Culto jovem aos sábados à noite"
    - "Retiros espirituais, acampamentos e conferências"
    - "Grupos de conexão universitários e profissionais"
    - "Ações missionárias e evangelismo criativo"

- id: "louvor-adoracao"
  name: "Louvor & Adoração"
