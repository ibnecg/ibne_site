<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCrossWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="gradHopeWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glowWhite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Symbol: Stylized Cross with Hope Arc -->
  <g transform="translate(15, 10)">
    <!-- Aura -->
    <circle cx="50" cy="50" r="42" fill="url(#gradHopeWhite)" opacity="0.2" />
    
    <!-- Rising Hope Arc -->
    <path d="M 18,74 C 28,34 68,18 84,24 C 92,27 88,38 78,38 C 50,38 32,54 26,76 Z" 
          fill="url(#gradHopeWhite)" filter="url(#glowWhite)" opacity="0.95" />

    <!-- Cross vertical beam -->
    <rect x="44" y="14" width="12" height="72" rx="6" fill="url(#gradCrossWhite)" />
    <!-- Cross horizontal beam -->
    <rect x="24" y="34" width="52" height="12" rx="6" fill="url(#gradCrossWhite)" />

    <!-- Heart/Glow center spark -->
    <circle cx="50" cy="40" r="4.5" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <!-- Main Acronym & Title -->
  <text x="130" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    IBNE
  </text>
  <text x="218" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
    CAMPO GRANDE
  </text>

  <!-- Subtitle -->
  <text x="132" y="76" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1" letter-spacing="2.2">
    IGREJA BATISTA NOVA ESPERANÇA
  </text>
  
  <!-- Motto pill/tagline -->
  <g transform="translate(132, 86)">
    <rect x="0" y="0" width="190" height="18" rx="9" fill="rgba(255,255,255,0.15)" />
    <circle cx="10" cy="9" r="3.5" fill="#fbbf24" />
    <text x="19" y="12.5" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#f8fafc" letter-spacing="1">
      UM LUGAR DE RECOMEÇOS
    </text>
  </g>
</svg>
